name: Deploy Android to Google Play (Live)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track (internal, alpha, beta, production)"
        required: true
        default: "internal"

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android-app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android-app/keystore/release-key.jks

      - name: Build Signed Release Bundle (.aab)
        env:
          KEYSTORE_FILE: keystore/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle -p android-app :app:bundleRelease

      - name: Decode Google Play service account
        env:
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          echo "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 -d > /tmp/google-play-service-account.json

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: /tmp/google-play-service-account.json
          packageName: com.example.odooopenaichecker
          releaseFiles: android-app/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: completed
